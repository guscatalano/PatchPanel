[package]
name = "pp-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono.workspace = true
clap.workspace = true
dashmap = "6.2.1"
futures-util.workspace = true
hex = "0.4.3"
ipnet = "2.12.2"
pp-proto.workspace = true
rcgen = "0.14.7"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
